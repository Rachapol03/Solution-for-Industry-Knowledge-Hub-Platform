{% extends "base.html" %}
{% block content %}

<h2 class="h4 fw-semibold mb-4">Document Upload</h2>

<div class="card shadow-sm">
    <div class="card-body">

        <form method="post"
              action="/upload"
              enctype="multipart/form-data"
              id="uploadForm">

            <!-- Upload Zone -->
            <input id="fileInput"
                   name="file"
                   type="file"
                   accept=".pdf,.png,.jpg,.jpeg"
                   style="display:none"
                   required>

            <label for="fileInput"
                   id="dropZone"
                   class="d-block text-center p-5 mb-4"
                   style="border:2px dashed #cfe2ff;
                          border-radius:8px;
                          cursor:pointer;
                          background:#f8fbff;">

                <div class="mb-2 fs-3">⬆️</div>
                <div class="fw-semibold">
                    Click to Upload or Drag File
                </div>
                <div class="text-muted small">
                    รองรับเฉพาะไฟล์: PDF, PNG, JPG, JPEG
                </div>
            </label>

            <!-- Title + Category (อยู่ล่าง Upload) -->
            <div class="row mb-3">
                <div class="col-md-8">
                    <label class="form-label">Document Title</label>
                    <input type="text"
                           name="title"
                           class="form-control"
                           placeholder="Enter document title"
                           required>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Category</label>
                    <select name="category"
                            class="form-select"
                            required>
                        <option value="">Select Category</option>
                        <option value="Policy">Policy</option>
                        <option value="Technical">Technical</option>
                        <option value="HR">HR</option>
                        <option value="Finance">Finance</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
            </div>

            <!-- Submit -->
            <button type="submit"
                    class="btn btn-primary">
                Submit for Indexing
            </button>

        </form>
    </div>
</div>

{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', ()=>{
    const form = document.getElementById('uploadForm');
    const fileInput = document.getElementById('fileInput');
    const drop = document.getElementById('dropZone');

    drop.addEventListener('click', ()=> fileInput.click());

    // drag & drop
    drop.addEventListener('dragover', (e)=>{
        e.preventDefault();
        drop.style.background = "#e9f2ff";
    });

    drop.addEventListener('dragleave', ()=>{
        drop.style.background = "#f8fbff";
    });

    drop.addEventListener('drop', (e)=>{
        e.preventDefault();
        fileInput.files = e.dataTransfer.files;
        drop.style.background = "#f8fbff";
    });

    form.addEventListener('submit', async (e)=>{
        e.preventDefault();

        const fd = new FormData(form);
        const btn = form.querySelector('button[type=submit]');
        btn.disabled = true;
        btn.innerText = 'Uploading...';

        try{
            const res = await fetch('/upload', {
                method: 'POST',
                body: fd
            });

            const data = await res.json();
            alert(res.ok ? 'Upload success' : data.error);
            form.reset();
        }catch(err){
            alert('Upload error');
        }

        btn.disabled = false;
        btn.innerText = 'Submit for Indexing';
    });
});
</script>
{% endblock %}
