<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Industry RAG Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-10">
    <div class="max-w-2xl mx-auto bg-white p-8 rounded-xl shadow">
        <h1 class="text-2xl font-bold text-blue-600 mb-4">🏭 ระบบถาม-ตอบ อุตสาหกรรม</h1>
        <p class="mb-4 text-gray-600">ยินดีต้อนรับ! ลองพิมพ์คำถามด้านล่าง:</p>
        
        <div id="chat-box" class="h-64 border p-4 mb-4 overflow-y-auto bg-gray-50 rounded">
            </div>

        <div class="flex gap-2">
            <input type="text" id="user-input" class="flex-1 border p-2 rounded" placeholder="พิมพ์คำถามที่นี่...">
            <button onclick="sendQuestion()" class="bg-blue-500 text-white px-4 py-2 rounded">ส่ง</button>
        </div>
    </div>

    <script>
        async function sendQuestion() {
            const input = document.getElementById('user-input');
            const chatBox = document.getElementById('chat-box');
            if (!input.value) return;

            chatBox.innerHTML += `<p><b>คุณ:</b> ${input.value}</p>`;
            const question = input.value;
            input.value = '';

            try {
                const response = await fetch('/ask', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({question: question})
                });
                const data = await response.json();
                chatBox.innerHTML += `<p class="text-blue-600"><b>AI:</b> ${data.answer}</p>`;
            } catch (e) {
                chatBox.innerHTML += `<p class="text-red-500">Error: เชื่อมต่อไม่ได้</p>`;
            }
        }
    </script>
</body>
</html>
