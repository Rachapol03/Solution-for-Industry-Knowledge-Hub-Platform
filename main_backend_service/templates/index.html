<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Cloud Knowledge Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        #chat-box { height: 450px; overflow-y: auto; border: 1px solid #dee2e6; padding: 20px; background: #fff; border-radius: 10px; }
        .bot-msg { background: #f8f9fa; padding: 15px; border-radius: 15px; margin-bottom: 15px; border-left: 5px solid #0d6efd; }
        .user-msg { background: #0d6efd; color: white; padding: 12px; border-radius: 15px; margin-bottom: 15px; text-align: right; margin-left: auto; width: fit-content; max-width: 80%; }
    </style>
</head>
<body class="bg-light">
    <div class="container py-5">
        <h2 class="text-center mb-4">☁️ Cloud Industry Knowledge Hub</h2>
        <div class="row">
            <div class="col-md-4">
                <div class="card shadow-sm border-0 p-4 mb-4">
                    <h5>📁 อัปโหลดข้อมูลใหม่</h5>
                    <p class="text-muted small">ระบบรองรับ PDF, JPG และ PNG</p>
                    <input type="file" id="fileInput" class="form-control mb-3" multiple>
                    <button onclick="uploadFiles()" class="btn btn-dark w-100" id="uploadBtn">Sync to Database</button>
                    <div id="status" class="mt-3 small text-info"></div>
                </div>
            </div>
            <div class="col-md-8">
                <div class="card shadow-sm border-0 p-4">
                    <h5>💬 สอบถามข้อมูลอัจฉริยะ (RAG)</h5>
                    <div id="chat-box" class="mb-3"></div>
                    <div class="input-group">
                        <input type="text" id="userInput" class="form-control" placeholder="พิมพ์คำถามที่นี่...">
                        <button onclick="sendMessage()" class="btn btn-primary">ถาม AI</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function uploadFiles() {
            const btn = document.getElementById('uploadBtn');
            const status = document.getElementById('status');
            const files = document.getElementById('fileInput').files;
            if (!files.length) return alert("กรุณาเลือกไฟล์");

            const formData = new FormData();
            for (let f of files) formData.append('files', f);

            btn.disabled = true; status.innerText = "กำลังประมวลผล OCR & Embedding...";
            try {
                const res = await fetch('/upload', { method: 'POST', body: formData });
                const data = await res.json();
                status.innerText = data.message || data.error;
            } catch (e) { status.innerText = "เกิดข้อผิดพลาดในการเชื่อมต่อ"; }
            btn.disabled = false;
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const chatBox = document.getElementById('chat-box');
            if (!input.value) return;

            const msg = input.value;
            chatBox.innerHTML += `<div class="user-msg">${msg}</div>`;
            input.value = ""; chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const res = await fetch('/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({message: msg})
                });
                const data = await res.json();
                chatBox.innerHTML += `<div class="bot-msg"><b>AI:</b> ${data.answer}</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            } catch (e) { chatBox.innerHTML += `<div class="text-danger">AI Error</div>`; }
        }
    </script>
</body>
</html>
