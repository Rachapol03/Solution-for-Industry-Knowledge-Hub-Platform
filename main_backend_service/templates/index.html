<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Knowledge Hub RAG</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto p-5">
        <h1 class="text-3xl font-bold mb-5 text-blue-600">Knowledge Hub RAG System</h1>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-white p-6 rounded shadow">
                <h2 class="text-xl font-semibold mb-4">1. เพิ่มข้อมูลเข้าระบบ (PDF/JPG/PNG)</h2>
                <input type="file" id="fileInput" class="mb-4 block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                <button onclick="uploadFile()" id="uploadBtn" class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">Upload & Process</button>
                <p id="uploadStatus" class="mt-2 text-sm text-gray-600"></p>
            </div>

            <div class="bg-white p-6 rounded shadow flex flex-col h-[500px]">
                <h2 class="text-xl font-semibold mb-4">2. สอบถามข้อมูล (Chatbot)</h2>
                <div id="chatBox" class="flex-grow overflow-y-auto border p-3 mb-4 space-y-2 bg-gray-50"></div>
                <div class="flex">
                    <input type="text" id="userInput" class="flex-grow border rounded-l px-3 py-2 outline-none" placeholder="พิมพ์คำถามที่นี่...">
                    <button onclick="sendMessage()" class="bg-blue-500 text-white px-4 py-2 rounded-r hover:bg-blue-600">ส่ง</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function uploadFile() {
            const fileInput = document.getElementById('fileInput');
            const status = document.getElementById('uploadStatus');
            if (!fileInput.files[0]) return alert("กรุณาเลือกไฟล์");

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            
            status.innerText = "กำลังประมวลผล... อาจใช้เวลาสักครู่";
            document.getElementById('uploadBtn').disabled = true;

            const res = await fetch('/upload', { method: 'POST', body: formData });
            const data = await res.json();
            
            status.innerText = data.message || data.error;
            document.getElementById('uploadBtn').disabled = false;
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const chatBox = document.getElementById('chatBox');
            const msg = input.value;
            if (!msg) return;

            chatBox.innerHTML += `<div class="text-right"><b>คุณ:</b> ${msg}</div>`;
            input.value = '';

            const res = await fetch('/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: msg })
            });
            const data = await res.json();
            chatBox.innerHTML += `<div class="text-left bg-blue-100 p-2 rounded"><b>AI:</b> ${data.answer || data.error}</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
